<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>whenwhatwhere</title>
  </head>

  <body>
    <h1 id="appTitle">
      whenwhatwhere
      <img id="headerImage" src="./assets/calendar.gif" alt="calendar gif" />
    </h1>
    <div id="app">
      <p>STOCKHOLM. Music events. Add your own.</p>
      <form class="nav-link" action="pages/addEvent.html" method="get">
        <button>Create event</button>
      </form>
      <form class="nav-link" action="pages/login.html" method="get">
        <button id="loginLink">Log in</button>
      </form>
      <button id="logoutLink" hidden>Log out</button>
      <button id="tabUpcoming" aria-pressed="true">[ Upcoming ]</button>
      <button id="tabPast" aria-pressed="false">Past</button>
    </div>
    <div id="eventList"></div>
    <p id="eventTitle"></p>
    <p id="loginStatus">Not logged in</p>
    <img id="footerImage" src="./assets/x-CALENDAR_1.gif" alt="calendar gif" />
    <script type="module" src="js/getEvents.js"></script>
    <script type="module" src="js/session.js"></script>
  </body>
</html>
