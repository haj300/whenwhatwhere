<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create event</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <h1 id="formTitle">create event</h1>
    <form id="eventForm" enctype="multipart/form-data">
      <label for="name">title:</label>
      <input type="text" id="name" name="name" required />
      <label for="time">time:</label>
      <input type="time" id="time" name="time" required />
      <label for="date">date:</label>
      <input type="date" id="date" name="date" required />
      <label for="location">location:</label>
      <input type="text" id="location" name="location" required />
      <label for="link">link:</label>
      <input type="url" id="link" name="link" />
      <label for="description">description:</label>
      <textarea
        id="description"
        name="description"
        class="description"
        required
      ></textarea>
      <label for="image">image:</label>
      <img id="currentImage" class="event-image" src="" alt="" hidden />
      <input type="file" id="image" name="file" accept="image/*" />
      <button type="submit" id="submitButton">create</button>
      <p id="formError" hidden class="form-error"></p>
    </form>
    <script type="module" src="../js/postEvent.js"></script>
  </body>
</html>
