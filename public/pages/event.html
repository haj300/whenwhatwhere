<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="event">
      <h1 id="name"></h1>
      <div class="event-meta">
        <p id="date"></p>
        <p id="location"></p>
        <p id="author"></p>
      </div>
      <img id="image" class="event-image" src="" alt="" />
      <p id="description"></p>
      <a id="link" href="" target="_blank" rel="noopener noreferrer" hidden></a>
      <button type="button" id="editButton" hidden>Edit Event</button>
      <section id="comments">
        <h2>Comments</h2>
        <ul id="commentList"></ul>
        <form id="commentForm" hidden>
          <textarea
            id="commentBody"
            maxlength="1000"
            required
            placeholder="Add a comment"
          ></textarea>
          <p id="commentError" hidden></p>
          <button type="submit" class="button">Post</button>
        </form>
      </section>
    </div>
    <script type="module" src="../js/getEvent.js"></script>
    <script type="module" src="../js/comments.js"></script>
  </body>
</html>
