<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>event</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="event">
      <div class="event-item">
        <div class="event-header">
          <h1 id="name"></h1>
        </div>
        <div class="event-body">
          <div class="event-meta">
            <p id="date"></p>
            <p id="location"></p>
            <p id="author"></p>
          </div>
          <img id="image" class="event-image" src="" alt="" />
          <p id="description"></p>
          <a
            id="link"
            href=""
            target="_blank"
            rel="noopener noreferrer"
            hidden
          ></a>
          <button type="button" id="editButton" hidden>uppdatera event</button>
        </div>
      </div>
      <section id="comments">
        <h2>kommentarer</h2>
        <ul id="commentList"></ul>
        <form id="commentForm">
          <input
            id="commentName"
            type="text"
            maxlength="20"
            placeholder="anonym"
          />
          <textarea
            id="commentBody"
            maxlength="1000"
            required
            placeholder="skriv en kommentar"
          ></textarea>
          <button type="button" id="toggleLogin" class="button">har du ett reserverat namn? logga in</button>
          <div id="loginFields" hidden>
            <input id="loginPassword" type="password" placeholder="lösenord" />
            <button type="button" id="loginSubmit" class="button">logga in</button>
          </div>
          <button type="button" id="toggleReserve" class="button">reservera detta namn</button>
          <div id="reserveFields" hidden>
            <input id="reservePassword" type="password" placeholder="välj ett lösenord" />
          </div>
          <p id="commentError" hidden></p>
          <button type="submit" class="button">skicka</button>
        </form>
      </section>
    </div>
    <script type="module" src="../js/getEvent.js"></script>
    <script type="module" src="../js/comments.js"></script>
  </body>
</html>
