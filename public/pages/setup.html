<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skapa ditt konto</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <h1>skapa ditt konto</h1>
    <form id="setupForm">
      <label for="username">välj användarnamn:</label>
      <input
        type="text"
        id="username"
        name="username"
        pattern="[A-Za-z0-9_. -]{3,20}"
        title="3-20 tecken: bokstäver, siffror, mellanslag, . _ eller -"
        required
      />
      <label for="password">välj lösenord:</label>
      <input type="password" id="password" name="password" required />
      <button type="submit">skapa konto</button>
      <p id="formError" hidden class="form-error"></p>
    </form>
    <script type="module" src="../js/setup.js"></script>
  </body>
</html>
